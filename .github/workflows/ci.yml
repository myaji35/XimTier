name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      # ⚠️ 임시 비차단(2026-07-16) — XIM-13 에서 해소할 것.
      #
      # 11개 gem 에 알려진 취약점이 있다 (avo, concurrent-ruby, crass, json, msgpack,
      # net-imap, nokogiri, puma, sqlite3, view_component, websocket-driver).
      # 전부 버전 업으로 해결되지만 puma(웹서버)·sqlite3(DB) 가 포함돼 일괄 업데이트는
      # 앱 기동 실패 위험이 있어 별도 작업으로 분리했다.
      #
      # 이 취약점들은 이번 변경으로 생긴 게 아니다. brakeman 이 구버전이라 스캔 자체가
      # 돌지 않는 등 CI 가 오래 실패 상태였고, 그 사이 아무도 보지 않았을 뿐이다.
      # 지금은 5일째 미배포 상태인 보안 수정(계정 탈취·세션 쿠키)을 먼저 내보내기 위해
      # 이 단계만 비차단으로 둔다.
      #
      # 재개 조건: XIM-13 에서 gem 업데이트 + 테스트 통과 후 continue-on-error 를 제거한다.
      - name: Scan for known security vulnerabilities in gems used
        continue-on-error: true
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # health 대신 개별 검사를 돌린다.
      # health 는 위 셋에 더해 "데이터 정규화"(키 알파벳 정렬·배열 들여쓰기)까지 요구하는데,
      # 이 저장소의 로케일 39개 파일이 전부 그 형식이 아니라 CI 가 상시 실패 상태였다.
      # 정렬은 화면에 아무 영향이 없고, 맞추려면 50개 파일 7,600여 줄을 뒤집어야 한다.
      # 실질적으로 중요한 것(누락/미사용/변수 불일치)만 검사한다.
      - name: i18n — 번역 누락 (PRD §FR-1 i18n coverage)
        run: bundle exec i18n-tasks missing

      - name: i18n — 미사용 키
        run: bundle exec i18n-tasks unused

      - name: i18n — 변수(%{...}) 불일치
        run: bundle exec i18n-tasks check-consistent-interpolations

      - name: Copy lint (금지어 검출, design.md §9)
        run: bash .claude/hooks/copy-lint.sh

  test:
    runs-on: ubuntu-latest
    # 이 앱은 모든 환경에서 SQLite 를 쓴다 (config/database.yml).
    # 예전 CI 는 postgres 서비스를 띄우고 DATABASE_URL 로 주입했는데, Gemfile 에 pg 가 없어
    # db:test:prepare 가 "pg is not part of the bundle" 로 죽었다 — 테스트가 시작조차 못 했다.
    # 앱이 쓰지 않는 서비스이므로 제거한다.
    env:
      RAILS_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec
