name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      # 비차단 해제 완료(2026-07-20, XIM-13). 취약점 11건을 전부 해소해
      # bundler-audit 이 다시 CI 를 막는다 — 새 취약점이 들어오면 여기서 걸린다.
      # 재발 시 gem 업데이트로 해결할 것. 다시 continue-on-error 로 덮지 마라.
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

      - name: Notify Slack on failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # 웹훅이 비어 있는 현재 환경에서는 조용히 건너뛴다.
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          payload=$(jq -n --arg text "❌ CI / scan_ruby 실패: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

      - name: Notify Slack on failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          payload=$(jq -n --arg text "❌ CI / scan_js 실패: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Notify Slack on failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          payload=$(jq -n --arg text "❌ CI / lint 실패: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true

  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # health 대신 개별 검사를 돌린다.
      # health 는 위 셋에 더해 "데이터 정규화"(키 알파벳 정렬·배열 들여쓰기)까지 요구하는데,
      # 이 저장소의 로케일 39개 파일이 전부 그 형식이 아니라 CI 가 상시 실패 상태였다.
      # 정렬은 화면에 아무 영향이 없고, 맞추려면 50개 파일 7,600여 줄을 뒤집어야 한다.
      # 실질적으로 중요한 것(누락/미사용/변수 불일치)만 검사한다.
      - name: i18n — 번역 누락 (PRD §FR-1 i18n coverage)
        run: bundle exec i18n-tasks missing

      - name: i18n — 미사용 키
        run: bundle exec i18n-tasks unused

      - name: i18n — 변수(%{...}) 불일치
        run: bundle exec i18n-tasks check-consistent-interpolations

      - name: Copy lint (금지어 검출, design.md §9)
        run: bash .claude/hooks/copy-lint.sh

      - name: Notify Slack on failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          payload=$(jq -n --arg text "❌ CI / i18n 실패: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true

  test:
    runs-on: ubuntu-latest
    # 이 앱은 모든 환경에서 SQLite 를 쓴다 (config/database.yml).
    # 예전 CI 는 postgres 서비스를 띄우고 DATABASE_URL 로 주입했는데, Gemfile 에 pg 가 없어
    # db:test:prepare 가 "pg is not part of the bundle" 로 죽었다 — 테스트가 시작조차 못 했다.
    # 앱이 쓰지 않는 서비스이므로 제거한다.
    #
    # environment: staging — credentials 복호화용 RAILS_MASTER_KEY 를 얻기 위함.
    # admin/wikis_controller 는 credentials 의 admin_wiki.password 가 없으면 클래스 로드 시점에
    # raise 한다(폴백 없이 부팅을 실패시키는 의도된 설계, ISS-015). test.rb 의
    # config.eager_load = ENV["CI"].present? 때문에 CI 에서만 이 컨트롤러가 로드되어
    # 테스트가 시작조차 못 했다. RAILS_MASTER_KEY 는 environment 레벨 시크릿이라
    # environment 를 지정하지 않은 잡에서는 접근할 수 없다.
    # repo 레벨 시크릿으로 올리지 않는 이유: 이 저장소는 public 이라 노출면을 넓히지 않는다.
    environment: staging
    env:
      RAILS_ENV: test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y libvips poppler-utils

      # 레이아웃이 stylesheet_link_tag "tailwind" 를 부르는데 app/assets/builds/ 는
      # .keep 만 추적한다(빌드 산출물 미커밋). CI 는 새로 체크아웃하므로 빌드해 두지 않으면
      # 뷰를 렌더하는 모든 스펙이 "asset 'tailwind.css' was not found" 로 실패한다.
      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

      - name: Notify Slack on failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          payload=$(jq -n --arg text "❌ CI / test 실패: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true
