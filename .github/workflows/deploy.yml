name: Deploy

# 트리거 정책:
# - main 푸시 → staging 자동 배포
# - workflow_dispatch (production 환경 manual approval) → 프로덕션 배포
#
# 사전 조건:
# - GitHub Environments에 `staging`, `production` 두 개 환경 등록
# - production 환경은 "Required reviewers"에 대표님 (또는 CTO) 지정
# - Repository Secrets:
#     RAILS_MASTER_KEY        — config/master.key 내용
#     GHCR 인증은 자동 발급되는 GITHUB_TOKEN을 사용하므로 GHCR_PAT은 불필요
#     KAMAL_SSH_PRIVATE_KEY   — Vultr 서버 root 접속용 SSH 키
#     SMTP_USERNAME / SMTP_PASSWORD / SENTRY_DSN — 선택
#     CF_TURNSTILE_SITE_KEY / CF_TURNSTILE_SECRET_KEY — XIM-16/17 활성 시
#     SLACK_WEBHOOK_URL — 리드 알림 활성 시

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'reports/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  # 1) 게이트: CI가 통과한 커밋만 배포 (CI workflow의 lint/test/scan_ruby/scan_js/i18n 모두 green)
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "target=staging" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Echo target
        run: echo "Will deploy to ${{ steps.target.outputs.target }}"

      - name: Notify Slack on failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # 웹훅을 아직 운영하지 않는 환경에서는 알림 단계 자체가 실패 원인이 되면 안 된다.
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          payload=$(jq -n --arg text "❌ Deploy / wait-for-ci 실패: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true
    outputs:
      target: ${{ steps.target.outputs.target }}

  deploy:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.wait-for-ci.outputs.target }}
    concurrency:
      group: deploy-${{ needs.wait-for-ci.outputs.target }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal -v '~> 2.0'

      - name: Configure SSH for Kamal
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$KAMAL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 158.247.235.31 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write config/master.key
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          mkdir -p config
          echo -n "$RAILS_MASTER_KEY" > config/master.key
          chmod 600 config/master.key

      - name: Write .kamal/secrets-common
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CF_TURNSTILE_SITE_KEY: ${{ secrets.CF_TURNSTILE_SITE_KEY }}
          CF_TURNSTILE_SECRET_KEY: ${{ secrets.CF_TURNSTILE_SECRET_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 관리자 알림(데모·문의·IR) 수신 주소. 저장소가 public 이라 deploy.yml 에
          # 평문으로 두면 개인 이메일이 노출된다.
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          # Solid Queue 전용 PostgreSQL accessory(queue_db)의 비밀번호. 호스트/DB명/유저는
          # database.yml 기본값을 쓰고 비밀번호만 Secrets 로 주입한다. (ISS-214)
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # 구글시트 리드 기록(ISS-239)
          GOOGLE_SHEETS_SA_EMAIL: ${{ secrets.GOOGLE_SHEETS_SA_EMAIL }}
          GOOGLE_SHEETS_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_SA_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          mkdir -p .kamal
          cat > .kamal/secrets-common <<SECRETS
          RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
          KAMAL_REGISTRY_PASSWORD=${KAMAL_REGISTRY_PASSWORD}
          SMTP_USERNAME=${SMTP_USERNAME}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          SENTRY_DSN=${SENTRY_DSN}
          CF_TURNSTILE_SITE_KEY=${CF_TURNSTILE_SITE_KEY}
          CF_TURNSTILE_SECRET_KEY=${CF_TURNSTILE_SECRET_KEY}
          SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          GOOGLE_SHEETS_SA_EMAIL=${GOOGLE_SHEETS_SA_EMAIL}
          GOOGLE_SHEETS_SA_PRIVATE_KEY=${GOOGLE_SHEETS_SA_PRIVATE_KEY//$'\n'/\\n}
          GOOGLE_SHEETS_ID=${GOOGLE_SHEETS_ID}
          SECRETS
          chmod 600 .kamal/secrets-common

      - name: Kamal config validation
        run: |
          if [ "${{ needs.wait-for-ci.outputs.target }}" = "production" ]; then
            # -d 는 서브커맨드 뒤에 와야 한다. 앞에 두면 Kamal 2.12 가 인식하지 못하고
            # Usage 만 출력한 뒤 종료코드 0 으로 끝난다 — 배포가 조용히 건너뛰어진다.
            OUT=$(kamal config 2>&1) || { echo "$OUT"; exit 1; }
          else
            OUT=$(kamal config -d staging 2>&1) || { echo "$OUT"; exit 1; }
          fi
          echo "$OUT"

          # kamal 이 명령을 인식 못하면 Usage 를 뱉고 0 으로 끝난다. 그 경우를 잡는다.
          if echo "$OUT" | grep -q "^Usage:"; then
            echo "::error::kamal 이 명령을 인식하지 못했다 (Usage 출력). 플래그 위치/버전을 확인할 것."
            exit 1
          fi
          # 정상 config 출력에는 반드시 이미지 좌표가 들어 있다.
          echo "$OUT" | grep -q "absolute_image" || {
            echo "::error::kamal config 출력이 비정상이다 — absolute_image 가 없다."
            exit 1
          }

      # 시크릿이 러너에 실제로 도달하는지 확인한다. 값은 절대 찍지 않고 길이만 본다.
      # 3회 연속 ghcr denied 가 났는데 같은 토큰이 로컬에선 push 권한(202)이 확인돼,
      # 값 자체가 아니라 "전달"이 끊긴 경우를 배제하기 위한 진단이다.
      - name: Registry secret 도달 확인
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # 이 값은 config/deploy.yml 의 registry.username 과 반드시 일치해야 한다 — 진단과 실제 로그인이 같은 좌표를 쓰게 하기 위함.
          KAMAL_REGISTRY_USERNAME: myaji35
          GHCR_REPO: myaji35/ximtier
        run: |
          echo "GITHUB_TOKEN 길이: ${#KAMAL_REGISTRY_PASSWORD}"
          echo "secrets-common 내 길이: $(grep '^KAMAL_REGISTRY_PASSWORD=' .kamal/secrets-common | cut -d= -f2- | wc -c)"
          if [ -z "$KAMAL_REGISTRY_PASSWORD" ]; then
            echo "::error::GITHUB_TOKEN 이 비어 있다 — 시크릿이 러너에 전달되지 않았다."
            exit 1
          fi

          # 길이만으로는 만료·무효 토큰을 걸러내지 못한다(gho_/ghp_ 모두 40자).
          # docker login 과 동일한 경로로 push scope 토큰을 받아 blob upload 를 개시해
          # "실제로 밀어넣을 수 있는 토큰인가"를 확인한다. 값은 절대 출력하지 않는다.
          B64=$(printf '%s:%s' "$KAMAL_REGISTRY_USERNAME" "$KAMAL_REGISTRY_PASSWORD" | base64 -w0)
          RT=$(curl -sS -H "Authorization: Basic ${B64}" \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${GHCR_REPO}:pull,push" \
               | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))')
          if [ -z "$RT" ]; then
            echo "::error::GHCR 토큰 교환 실패 — GITHUB_TOKEN 이 유효하지 않다."
            exit 1
          fi
          PUSH_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${RT}" \
            "https://ghcr.io/v2/${GHCR_REPO}/blobs/uploads/")
          echo "blob upload 개시 HTTP: ${PUSH_CODE}"
          if [ "$PUSH_CODE" != "202" ]; then
            echo "::error::GHCR push 권한 없음(HTTP ${PUSH_CODE}). GITHUB_TOKEN 에 packages: write 권한이 없다."
            echo "::error::복구: 워크플로우에 permissions: packages: write 가 선언되어 있는지 확인하라."
            exit 1
          fi

      - name: Kamal deploy
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ needs.wait-for-ci.outputs.target }}" = "production" ]; then
            kamal deploy 2>&1 | tee /tmp/deploy.log
          else
            kamal deploy -d staging 2>&1 | tee /tmp/deploy.log
          fi

          # Usage 출력 = 명령 미인식. 종료코드가 0 이어도 배포는 일어나지 않았다.
          # 이 검사가 없어서 5일간 배포가 조용히 건너뛰어진 채로 지나갔다.
          if grep -q "^Usage:" /tmp/deploy.log; then
            echo "::error::kamal deploy 가 실행되지 않았다 (Usage 출력)."
            exit 1
          fi

      - name: Post-deploy health check
        run: |
          TARGET="${{ needs.wait-for-ci.outputs.target }}"
          if [ "$TARGET" = "production" ]; then
            HOST="ximtier.158.247.235.31.nip.io"
          else
            HOST="ximtier-staging.158.247.235.31.nip.io"
          fi

          healthy=false
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://${HOST}/up" || true)
            if [ "$code" = "200" ]; then
              echo "OK /up=200 on attempt $i"
              healthy=true
              break
            fi
            echo "attempt $i: got ${code:-no-response}; sleeping 5s"
            sleep 5
          done

          actual_sha="no-response"
          if [ "$healthy" = "true" ]; then
            version_json=$(curl -skf "https://${HOST}/version" || true)
            actual_sha=$(echo "$version_json" | jq -r '.version // "invalid-response"' 2>/dev/null || echo "invalid-response")
          fi

          if [ "$healthy" = "true" ] && [ "$actual_sha" = "$GITHUB_SHA" ]; then
            echo "OK deployed SHA=$actual_sha"
            exit 0
          fi

          # staging 도 nginx block + TLS 를 갖췄으므로(ISS-033) production 과 동일하게 막는다.
          echo "::error::배포 버전 검증 실패 — 기대 SHA: $GITHUB_SHA, 실제 SHA: $actual_sha"
          exit 1

      - name: Notify Slack on failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # 웹훅을 아직 운영하지 않는 환경에서는 알림 단계 자체가 실패 원인이 되면 안 된다.
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          payload=$(jq -n --arg text "❌ Deploy / deploy 실패: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{text: $text}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" || true
