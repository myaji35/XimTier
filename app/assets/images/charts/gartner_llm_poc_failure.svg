<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">LLM 1차 도입 결과 분포 — 기대 충족 vs 미달</title>
  <desc id="desc">생성형 AI POC 중 약 75%가 비즈니스 기대를 충족하지 못한다는 Gartner 추정치를 자체 재작성한 막대 차트.</desc>

  <style>
    .axis  { stroke: #dddddd; stroke-width: 1; }
    .grid  { stroke: #ebebeb; stroke-width: 1; }
    .label { font: 500 12px -apple-system, "Inter", sans-serif; fill: #222222; }
    .num   { font: 700 32px -apple-system, "Inter", sans-serif; fill: #222222; letter-spacing: -0.02em; }
    .num-r { fill: #ff385c; }
    .sub   { font: 400 11px -apple-system, "Inter", sans-serif; fill: #717171; }
    .src   { font: 600 10px ui-monospace, Menlo, monospace; fill: #717171; letter-spacing: 0.06em; }
  </style>

  <text x="32" y="36" class="label" style="font-size:14px;">기업 LLM POC 결과 (n ≈ ~1,200, 1차 도입 기준)</text>

  <line x1="32" y1="320" x2="608" y2="320" class="axis"/>

  <line x1="32"  y1="240" x2="608" y2="240" class="grid"/>
  <line x1="32"  y1="160" x2="608" y2="160" class="grid"/>
  <line x1="32"  y1="80"  x2="608" y2="80"  class="grid"/>

  <rect x="120" y="240" width="120" height="80" fill="#222222"/>
  <text x="180" y="218" text-anchor="middle" class="num">25%</text>
  <text x="180" y="344" text-anchor="middle" class="label">기대 충족</text>
  <text x="180" y="358" text-anchor="middle" class="sub">production 진입</text>

  <rect x="400" y="80" width="120" height="240" fill="#ff385c"/>
  <text x="460" y="58" text-anchor="middle" class="num num-r">75%</text>
  <text x="460" y="344" text-anchor="middle" class="label">기대 미달</text>
  <text x="460" y="358" text-anchor="middle" class="sub">중단·축소·재검토</text>

  <text x="32" y="354" class="src">SOURCE: GARTNER 2024 GENERATIVE AI POC OUTCOMES (인용·자체 재작성)</text>
</svg>
