<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT vs XimTier — 의사결정 4축 비교</title>
  <desc id="desc">설명 가능성, 수치적 증명, Reverse What-If, 감사 통과 4축의 정성 비교 레이더 차트.</desc>

  <style>
    .grid  { stroke: #ebebeb; stroke-width: 1; fill: none; }
    .axis  { stroke: #dddddd; stroke-width: 1; }
    .lab   { font: 600 12px -apple-system, "Inter", sans-serif; fill: #222222; }
    .sub   { font: 400 10px -apple-system, "Inter", sans-serif; fill: #717171; }
    .src   { font: 600 10px ui-monospace, Menlo, monospace; fill: #717171; letter-spacing: 0.06em; }
    .legend{ font: 500 12px -apple-system, "Inter", sans-serif; fill: #222222; }
  </style>

  <g transform="translate(240,240)">
    <polygon class="grid" points="0,-180 180,0 0,180 -180,0"/>
    <polygon class="grid" points="0,-135 135,0 0,135 -135,0"/>
    <polygon class="grid" points="0,-90  90,0  0,90  -90,0"/>
    <polygon class="grid" points="0,-45  45,0  0,45  -45,0"/>

    <line class="axis" x1="0" y1="-180" x2="0" y2="180"/>
    <line class="axis" x1="-180" y1="0" x2="180" y2="0"/>

    <polygon points="0,-60 60,0 0,90 -45,0" fill="#222222" fill-opacity="0.18" stroke="#222222" stroke-width="2"/>

    <polygon points="0,-160 170,0 0,170 -160,0" fill="#ff385c" fill-opacity="0.20" stroke="#ff385c" stroke-width="2.5"/>
  </g>

  <text x="240" y="38" text-anchor="middle" class="lab">설명 가능성</text>
  <text x="240" y="52" text-anchor="middle" class="sub">XAI · SHAP 기반 어트리뷰션</text>

  <text x="446" y="244" text-anchor="end" class="lab">수치적 증명</text>
  <text x="446" y="258" text-anchor="end" class="sub">R² · p-value · 신뢰구간</text>

  <text x="240" y="458" text-anchor="middle" class="lab">Reverse What-If</text>
  <text x="240" y="472" text-anchor="middle" class="sub">목표→최소 변경량 역산</text>

  <text x="34" y="244" class="lab">감사 통과</text>
  <text x="34" y="258" class="sub">EU AI Act · 5년 보관 대응</text>

  <g transform="translate(32,32)">
    <rect x="0" y="0" width="14" height="14" fill="#222222" fill-opacity="0.5" stroke="#222222"/>
    <text x="20" y="12" class="legend">ChatGPT (LLM 일반)</text>
    <rect x="0" y="22" width="14" height="14" fill="#ff385c" fill-opacity="0.5" stroke="#ff385c"/>
    <text x="20" y="34" class="legend">XimTier</text>
  </g>

  <text x="32" y="464" class="src">SOURCE: 자체 정성 평가 (4축 0~10 척도) · XimTier internal benchmark 2026-05</text>
</svg>
