# XimTier — Kamal 2 Staging Deploy Config
# 호출: kamal -d staging deploy
#
# prod와 동일 서버(Vultr ICN), kamal-proxy를 host-based routing으로 공유.
# 스테이징은 별도 컨테이너 이름(`ximtier-staging`) + 별도 storage volume +
# 별도 nip.io 호스트(`ximtier-staging.158.247.235.31.nip.io`).
#
# 안전 원칙:
# - registry는 prod와 동일 GHCR repo. 이미지 태그는 git SHA 자동.
# - storage volume(`ximtier_staging_storage`)은 prod(`ximtier_storage`)와 분리.
# - 데이터 동기화 없음. 스테이징은 매번 빈 DB로 시작 가능.

service: ximtier-staging
image: myaji35/ximtier

servers:
  web:
    - 158.247.235.31

ssh:
  user: root

# proxy 는 prod(deploy.yml)의 설정 위에 병합된다.
# prod 가 hosts(배열)를 쓰므로 여기서도 hosts 로 맞춰야 배열이 통째로 덮인다.
# host(단수)를 쓰면 prod 의 hosts 와 함께 남아
# "Specify one of 'host' or 'hosts', not both" 로 배포가 실패한다.
proxy:
  hosts:
    - ximtier-staging.158.247.235.31.nip.io
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 10

deploy_timeout: 120
drain_timeout: 30

registry:
  server: ghcr.io
  username: myaji35
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - SENTRY_DSN
    - CF_TURNSTILE_SITE_KEY
    - CF_TURNSTILE_SECRET_KEY
    - SLACK_WEBHOOK_URL
    # accessory queue_db의 비밀번호를 웹 컨테이너에도 전달한다.
    # 호스트/DB명/유저는 database.yml 기본값(ximtier-queue_db / ximtier_queue_staging / ximtier)을 쓴다.
    # 실제 비밀번호는 코드에 절대 넣지 않는다.
    - POSTGRES_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    RAILS_ENV: production
    QUEUE_DB_NAME: "ximtier_queue_staging"
    # 스테이징도 RAILS_ENV=production을 쓰지만 APP_ENV로 분기.
    APP_ENV: staging
    PORT: "3000"
    WEB_CONCURRENCY: "1"
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"
    DB_HOST: ""
    APP_HOST: "ximtier-staging.158.247.235.31.nip.io"
    APP_PROTOCOL: "http"
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_DOMAIN: "ximtier-staging.158.247.235.31.nip.io"
    SMTP_AUTH: "plain"
    SMTP_STARTTLS: "true"
    PLAUSIBLE_DOMAIN: ""
    GA4_MEASUREMENT_ID: ""
    # 네이버 서치어드바이저 — 네이버 발급값 입력 (스테이징은 빈 값 유지)
    NAVER_SITE_VERIFICATION: ""
    # robots.txt는 staging에서 강제 Disallow (production.rb에서 APP_ENV 분기).
    ROBOTS_DISALLOW_ALL: "true"

volumes:
  - "ximtier_staging_storage:/rails/storage"

# Solid Queue 전용 PostgreSQL — 앱은 kamal 네트워크에서 ximtier-queue_db 호스트명으로 접근
accessories:
  queue_db:
    image: postgres:16-alpine
    host: 158.247.235.31
    env:
      clear:
        POSTGRES_DB: ximtier_queue_staging
        POSTGRES_USER: ximtier
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - "ximtier_queue_db_staging_data:/var/lib/postgresql/data"
    options:
      network: kamal

asset_path: /rails/public/assets

builder:
  arch: amd64
  remote: ssh://root@158.247.235.31

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole"
