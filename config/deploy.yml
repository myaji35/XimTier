# XimTier — Kamal 2 Deploy Config
# 서버: Vultr ICN (158.247.235.31), 0012(InsureGraph)와 kamal-proxy 공유
# 접속: http://ximtier.158.247.235.31.nip.io
# 업데이트: 2026-05-12

service: ximtier
# Kamal 2가 registry.server를 자동 결합하므로 username/repo 형태로만.
image: myaji35/ximtier

servers:
  web:
    - 158.247.235.31

ssh:
  user: root

# kamal-proxy를 0012와 공유 (host-based routing) — proxy.host로 분기됨
# Dockerfile은 Thruster를 통해 :80에서 외부 노출 — app_port: 80
# 외부 nginx가 80/443을 받아 내부 kamal-proxy(:3030)로 라우팅하는 공유 환경.
# kamal-proxy는 hosts 배열로 받는 호스트 다중 등록. SSL은 외부 nginx + certbot에서 처리.
proxy:
  hosts:
    - ximtier.com
    - www.ximtier.com
    - ximtier.158.247.235.31.nip.io
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 10

# 첫 부팅 전체 대기 — root-level (Kamal 2 스키마, 기본 30s)
# db:prepare(SQLite 4개 DB 생성) + eager_load + Devise/Avo init 합산 ~45s 필요
deploy_timeout: 120
drain_timeout: 30

# GitHub Container Registry
registry:
  server: ghcr.io
  username: myaji35
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    # SMTP — 도메인/계정 결정 후 .kamal/secrets에 채워 활성
    - SMTP_USERNAME
    - SMTP_PASSWORD
    # Sentry/Plausible — 결정 후 채워 활성 (없으면 자동 비활성)
    - SENTRY_DSN
    # Cloudflare Turnstile (FR-4 문의 폼, FR-5 데모 신청) — 미설정 시 view에서 자동 비활성
    - CF_TURNSTILE_SITE_KEY
    - CF_TURNSTILE_SECRET_KEY
    # Slack 알림 (FR-4 문의/FR-5 데모) — 미설정 시 알림 silently skip
    - SLACK_WEBHOOK_URL
    # 관리자 알림(데모·문의·IR) 수신 주소. 미설정 시 myaji35@ximtier.com 로 폴백
    - ADMIN_EMAIL
    # accessory queue_db의 비밀번호를 웹 컨테이너에도 전달한다.
    # 호스트/DB명/유저는 database.yml 기본값(ximtier-queue_db / ximtier_queue_production / ximtier)을 쓴다.
    # 실제 비밀번호는 코드에 절대 넣지 않는다.
    - POSTGRES_PASSWORD
    # 구글시트 리드 기록(ISS-239). 문의/데모/테스트 태그로 시트에 append 한다.
    # SA 개인키는 절대 평문 커밋 금지 — GitHub Secrets 경유.
    - GOOGLE_SHEETS_SA_EMAIL
    - GOOGLE_SHEETS_SA_PRIVATE_KEY
    - GOOGLE_SHEETS_ID
  clear:
    SOLID_QUEUE_IN_PUMA: true
    RAILS_ENV: production
    PORT: "3000"
    # XimTier SaaS 분석 게이트웨이 — 헤더 로그인 버튼 연결 대상
    # 구주소(ximtier-saas.158.247.235.31.nip.io)는 서버 IP 가 노출되고 301 을 한 번 더 탄다.
    # 정식 도메인으로 직접 연결한다 (XIM-20 연장선).
    XIMTIER_SAAS_URL: https://saas.ximtier.com
    WEB_CONCURRENCY: "1"
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"
    # SQLite (Rails 8 기본) — Solid Queue/Cache/Cable 동일 storage 사용
    DB_HOST: ""
    # 도메인 — ximtier.com 정식 운영 (2026-05-14 SSL 발급 완료)
    APP_HOST: "ximtier.com"
    APP_PROTOCOL: "https"
    # SMTP — 자사 Mailu (SMTP_USERNAME=info@ximtier.com, SMTP_PASSWORD는 .kamal/secrets에 주입)
    # Vultr 프로덕션 서버에서 25·587번은 닫혀 있고 465번만 열려 있어 implicit SSL로 접속한다.
    # 인증서 이름 검증을 위해 서버 IP가 아닌 mx.ximtier.com 호스트명을 사용한다.
    SMTP_HOST: "mx.ximtier.com"
    SMTP_PORT: "465"
    SMTP_DOMAIN: "ximtier.com"
    SMTP_AUTH: "plain"
    SMTP_SSL: "true"
    SMTP_STARTTLS: "false"
    # Mailu 465는 자체 서명 인증서다(Let's Encrypt 미발급 — mail.ximtier.com이 Cloudflare
    # Tunnel 뒤에 있어 ACME HTTP 검증이 닿지 않는다). 우리 서버 → 우리 메일서버 구간이므로
    # 검증을 생략한다. 정식 인증서 발급은 ISS-252.
    SMTP_VERIFY_MODE: "none"
    MAIL_FROM: "XimTier <info@ximtier.com>"
    # Plausible — 도메인 결정 후 활성
    PLAUSIBLE_DOMAIN: ""
    # GA4 — XimTier 프로덕션 웹 속성
    GA4_MEASUREMENT_ID: "G-Q2EYN13CYN"
    # 네이버 서치어드바이저 — 네이버 발급값 입력
    NAVER_SITE_VERIFICATION: "e6366cd0bbe57817b30665e642956495d07a1297"

# SQLite + Active Storage volume
volumes:
  - "ximtier_storage:/rails/storage"

# Solid Queue 전용 PostgreSQL — 앱은 kamal 네트워크에서 ximtier-queue_db 호스트명으로 접근
accessories:
  queue_db:
    image: postgres:16-alpine
    host: 158.247.235.31
    env:
      clear:
        POSTGRES_DB: ximtier_queue_production
        POSTGRES_USER: ximtier
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - "ximtier_queue_db_data:/var/lib/postgresql/data"
    options:
      network: kamal

asset_path: /rails/public/assets

# 원격 amd64 native 빌드 (QEMU 회피) — Vultr 서버에서 직접 빌드
builder:
  arch: amd64
  remote: ssh://root@158.247.235.31

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole"
