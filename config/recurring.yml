# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # 처리방침 3항이 공표한 보유기간을 이행한다 (ISS-009).
  # 이 잡이 멈추면 방침 위반 상태가 된다 — 로그의 [PurgeExpiredRecords] 로 확인할 것.
  purge_expired_records:
    class: PurgeExpiredRecordsJob
    schedule: every day at 4am

  # 실패 잡이 알림 없이 누적되지 않도록 매시간 확인한다 (ISS-141).
  # 로그의 [MonitorFailedJobs] 와 ADMIN_EMAIL 알림으로 확인할 것.
  monitor_failed_jobs:
    class: MonitorFailedJobsJob
    schedule: every hour
