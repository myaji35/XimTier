ko:
  solution:
    eyebrow: 솔루션
    h1: LLM과 XimTier는 서로 다른 일을 한다 — 결합하면 완성된다
    lead: "\"ChatGPT가 설명한다면, XimTier는 증명한다.\" LLM 언어 능력 + XimTier 계산 능력 = 진짜 의사결정 AI"
    callout: ChatGPT는 회의실에서 발표하고, XimTier는 회의 전에 데이터로 답을 만든다.
    formula: "LLM (언어) + XimTier (계산) = 진짜 의사결정 AI"
    workflow_title: 5단계 One-Stop 워크플로우
    table:
      header_llm: LLM (언어 인터페이스)
      header_xst: XimTier (계산 엔진)
      subhead_llm: ChatGPT · Claude · Gemini
      subhead_xst: Decision Intelligence · Reverse What-If
      rows:
        - llm: 언어 이해 / 자연어 대화
          xst: "실제 수치 계산 — 회귀·시계열·분류 직접 실행"
        - llm: 일반 지식 검색 · 텍스트 생성
          xst: "Reverse What-If — 목표 입력 → 최적 변수 역산"
        - llm: 실제 통계 계산 (회귀·SHAP) 불가
          xst: "SHAP 기반 수학적 XAI — 규제 통과 가능"
        - llm: Reverse What-If — 구조적 불가
          xst: "온프레미스 / 프라이빗 — 데이터 외부 유출 없음"
        - llm: 기업 내부 데이터 접근 불가
          xst: "산업별 도메인 깊이 — 제조·병원·행정 특화"
        - llm: 규제 XAI 의무 충족 불가
          xst: "동일 입력 → 동일 출력 — 재현 가능한 일관성"
    prescription:
      eyebrow: 진단이 아니라 처방
      h2: 대부분의 AI 보고서는 "정확도 0.9 나왔습니다"에서 끝난다
      lead: 운영본부장이 알고 싶은 건 "월요일에 뭘 바꿔야 하나"다.
      gap_title: 중요도 1위가 실행 대상이 아니다
      gap_body: 편의점 480개 점포 분석에서 영향력 1·3위는 오피스 상권(0.172)과 반경 300m 경쟁점 수(0.135)였다. 둘 다 못 바꾼다. 이미 낸 점포의 입지를 옮길 수 없고, 옆에 들어온 경쟁점을 없앨 수도 없다.
      gap_quote: "\"입지가 중요합니다\"는 맞는 분석이지만 실행할 수 없는 정보다. 이 구분을 안 해주는 보고서는 읽고 나서 \"그래서 뭘 하라는 건데?\"로 끝난다."
      steps_title: XimTier가 한 단계 더 가는 방법
      steps:
        - title: 바꿀 수 있는 것만 남긴다
          desc: 변수마다 통제 가능 여부를 판정한다. 입지·경쟁점은 제외, 청결 점검·판촉 실행률·발주 정확도는 실행 후보로.
        - title: 결과가 이미 반영된 변수를 걷어낸다
          desc: 월 정산금액·매출순위 같은 사후 확정 필드는 학습에서 뺀다. 넣으면 정확도가 1.000이 되지만 아무것도 알려주지 않는다.
        - title: 얼마나 차이 나는지 수치로 낸다
          desc: 판촉 실행률 하위 33% 대비 상위 33%의 우수점포 비율 격차 +23.1%p. 성실히 실행하는 점포가 우수점포가 될 확률이 1.8배.
        - title: 못 바꾸는 것은 "누구부터"로 쓴다
          desc: 경쟁점 3개 이상 180개 점포의 우수 비율은 무경쟁 구간의 1/3. 지원을 전 점포에 골고루 쓰는 것보다 이 그룹에 집중하는 편이 효율이 높다.
      honesty_title: 모르면 모른다고 한다
      honesty_body: 예측 근거가 부족하거나 해당 구간에 데이터가 없으면 "산출 불가"를 낸다. 평균값이나 기본값으로 빈칸을 채우지 않는다. 처방에서 제외된 변수는 제외 사유와 함께 그대로 보여준다.
  workflow:
    steps:
      - title: 데이터 탐색
        sub: WhatDataAI
        desc: 비전문가도 즉시 데이터 구조를 파악
      - title: 통계 분석
        sub: Regression · Classification
        desc: 회귀·시계열·분류를 자동으로 실행
      - title: Reverse What-If
        sub: ★ 핵심
        desc: 목표값 입력 → 최적 변수 역산
      - title: 자동 보고서
        sub: One-click Report
        desc: 의사결정용 임원 보고서를 즉시 생성
      - title: AI Q&A
        sub: Conversational
        desc: 결과에 대해 자연어로 질문·심화
