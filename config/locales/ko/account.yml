ko:
  account:
    close:
      title: 회원탈퇴
      lead: 탈퇴하시면 아래 정보가 즉시 삭제됩니다. 삭제된 데이터는 복구할 수 없습니다.
      what_happens: 삭제되는 정보
      deleted_items:
        - 계정 정보 (이메일, 이름, 회사, 직책)
        - 데모 신청 내역 전부
        - 신청에 첨부한 데이터 파일
        - 신청에 남긴 코멘트와 XimTier 팀의 답변
      irreversible: 유예기간 없이 즉시 파기되며, 되돌릴 수 없습니다.
      confirm_password: 본인 확인을 위해 비밀번호를 입력해 주세요
      submit: 탈퇴하기
      cancel: 취소
      confirm_dialog: 정말 탈퇴하시겠습니까? 모든 데이터가 즉시 삭제되며 복구할 수 없습니다.
      flash:
        done: 탈퇴가 완료되었습니다. 그동안 이용해 주셔서 감사합니다.
      errors:
        password_required: 비밀번호를 입력해 주세요.
        password_invalid: 비밀번호가 일치하지 않습니다.
        failed: 탈퇴 처리 중 문제가 발생했습니다. contact@ximtier.io 로 문의해 주세요.
