  v3detail:
    # ───────────────────────── Chapter 02 · Data Exploration (8 features) ─────────────────────────
    data_explore:
      chapter: "02 Data Exploration"
      slide: "06 · 23"
      back_path: "data"
      eyebrow: "01 · Data Exploration"
      title: "Data Exploration"
      summary: "Automatically surfaces key fields, per-field descriptive statistics, technical statistics, and a correlation heatmap from loaded data → one-stop analysis of data structure and field relationships."
      stats:
        - { value: "500", unit: "rows", label: "Sample dataset rows" }
        - { value: "26", unit: "cols", label: "Analysis fields" }
        - { value: "0.47", unit: "MB", label: "Data size" }
        - { value: "0", unit: "", label: "Missing values" }
      blocks:
        - { head: "Dataset Overview", body: "Summarizes rows, columns, missing values, and memory usage on load, plus per-column data type, missing ratio, and unique count." }
        - { head: "Descriptive Statistics", body: "Auto-computes mean, std, min, max, and quartiles across all fields, downloadable as CSV." }
        - { head: "Categorical Statistics", body: "Provides group-wise frequency and composition for categorical variables." }
        - { head: "Correlation Analysis", body: "Generates a correlation heatmap across numeric fields to reveal relationships at a glance." }
      result: "One-stop analysis of data structure and relationships"

    whatdataai:
      chapter: "02 Data Exploration"
      slide: "06 · 24"
      back_path: "data"
      eyebrow: "02 · WhatDataAI Analysis"
      title: "WhatDataAI Analysis"
      summary: "Analyzes data fields to auto-recommend applicable AI algorithms (regression, discriminant, multi-class, time-series) and usable Y/X variables → tells you what you can do with your data and which data matters most."
      stats:
        - { value: "62", unit: "", label: "Regression-ready Y variables" }
        - { value: "62", unit: "", label: "Time-series-ready Y variables" }
        - { value: "4", unit: "", label: "Analysis families" }
      blocks:
        - { head: "Y-variable Performance", body: "Pre-computes predictive performance per candidate Y variable across regression / discriminant / multi-class / time-series." }
        - { head: "Algorithm Applicability", body: "Compares usable Y-variable counts per analysis family in a bar chart." }
        - { head: "Combined Results", body: "Summarizes applicability across the four families and presents a variable relationship graph." }
        - { head: "Recommendations", body: "Suggests optimization targets, noise-variable removal, and key X-variable candidates." }
      result: "New business opportunities · cost reduction · revenue creation"

    address_xy:
      chapter: "02 Data Exploration"
      slide: "06 · 25"
      back_path: "data"
      eyebrow: "03 · Address XY Refinement"
      title: "Address XY Refinement"
      summary: "Refines address fields using the Kakao API and an internal learned-address base to parse latitude/longitude and standard administrative regions → cuts preprocessing time for thematic maps and charts."
      stats:
        - { value: "500", unit: "", label: "Total records" }
        - { value: "408", unit: "", label: "Refinable records" }
        - { value: "92", unit: "", label: "API calls required" }
      blocks:
        - { head: "Kakao REST API", body: "Converts addresses to coordinates after registering a Kakao Map API key; an internal address dictionary minimizes API calls." }
        - { head: "Standard Region Parsing", body: "Decomposes addresses into standard administrative names (province, city/county, dong) with auto-generated geocoded columns." }
        - { head: "Conversion Tracking", body: "Shows 408 refinable and 92 API-required out of 500 records to predict conversion cost up front." }
      result: "One-stop analysis foundation — reduced preprocessing time"

    explore_chart:
      chapter: "02 Data Exploration"
      slide: "06 · 26 · 27"
      back_path: "data"
      eyebrow: "04 · AI Exploration Charts"
      title: "AI Exploration Charts"
      summary: "Individual charts support ~24 types (basic, distribution/statistics, relationship, advanced, word cloud). Automatic charting generates 22 types from X/Y/Z axis variable inputs."
      stats:
        - { value: "24", unit: "", label: "Individual charts" }
        - { value: "22", unit: "", label: "Automatic charts" }
        - { value: "3", unit: "axes", label: "X · Y · Z variables" }
      blocks:
        - { head: "Individual Charts (24)", body: "Basic (bar, line, area, pie, donut), distribution/statistics (histogram, box, violin, QQ), relationship (scatter, scatter matrix, heatmap), advanced (3D scatter, radar, treemap)." }
        - { head: "Automatic Charts (22)", body: "Set X/Y/Z axes, aggregation, binning, and outlier handling to auto-generate charts by category." }
        - { head: "Faster Chart Building", body: "Auto-guides optimal chart composition for the data, saving both ideation and production time." }
      result: "Easy visualization for reports from your data"

    text_explore:
      chapter: "02 Data Exploration"
      slide: "06 · 28"
      back_path: "data"
      eyebrow: "05 · AI Text Exploration"
      title: "AI Text Exploration"
      summary: "Supports table word clouds and unstructured-document word clouds → improves understanding of documents and fields → shortens analysis time and surfaces insights."
      stats:
        - { value: "2", unit: "types", label: "Table · unstructured word clouds" }
        - { value: "PDF·DOCX·PPTX·Image", unit: "", label: "Supported inputs" }
      blocks:
        - { head: "Table Word Cloud", body: "Generates frequency-based word clouds from text fields to grasp field contents intuitively." }
        - { head: "Unstructured Document Word Cloud", body: "Upload PDF/Word/PowerPoint/image or paste text → morpheme analysis and stopword editing → word cloud." }
        - { head: "Relationship Graph", body: "Visualizes keyword relationships extracted from text as a network graph." }
      result: "Shorter analysis time and insight discovery"

    thematic_map:
      chapter: "02 Data Exploration"
      slide: "06 · 29"
      back_path: "data"
      eyebrow: "06 · Thematic Map Analysis"
      title: "Thematic Map Analysis"
      summary: "Auto-loads domestic and global maps from your data and reveals geographic distribution → spatial analysis for use cases such as balanced regional development."
      stats:
        - { value: "5", unit: "", label: "Administrative boundaries" }
        - { value: "7", unit: "", label: "Grid/hex boundaries (100m–10km)" }
        - { value: "4", unit: "types", label: "Point · grid/hex · boundary · integrated" }
      blocks:
        - { head: "Base Maps", body: "VWorld maps (base, satellite, hybrid) for Korea; OpenStreetMap for overseas." }
        - { head: "Standard Boundaries", body: "5 administrative boundaries + 7 grid/hex boundaries (100m, 250m, 500m, 1km, 2km, 5km, 10km)." }
        - { head: "Map Types", body: "Point (mark, bubble, heatmap, marker cluster), grid/hex, administrative-area (bar, pie, violin, treemap, layer, polar, density, choropleth), integrated." }
      result: "Spatial analysis for balanced regional development"

    insight_report:
      chapter: "02 Data Exploration"
      slide: "06 · 30"
      back_path: "data"
      eyebrow: "07 · AI Insight Report"
      title: "AI Insight Report"
      summary: "Ask in natural language over a knowledge graph and GPT recommends charts, maps, implications, and policy suggestions → auto-generates a combined report including What-if / Reverse What-if analysis."
      stats:
        - { value: "No", unit: "", label: "Hallucination" }
        - { value: "Graph", unit: "based", label: "Decision intelligence AI" }
      blocks:
        - { head: "Natural-Language Query", body: "e.g., \"Analyze variables correlated with quarantine complaints in Gimhae, identify monthly and spatial patterns, and propose ways to cut complaints by 50%.\"" }
        - { head: "GPT Auto Report", body: "Auto-generates GPT analysis charts, spatial materials, and a results report combining charts, maps, statistics, What-if and Reverse What-if." }
        - { head: "Data-Grounded, No Hallucination", body: "Top-tier auto charts and composite maps, LLM-driven policy derivation — all grounded in data to prevent hallucination." }
      result: "Evidence-based administrative support (data-grounded LLM)"

    target_yx:
      chapter: "02 Data Exploration"
      slide: "06 · 31"
      back_path: "data"
      eyebrow: "08 · AI Target YX Optimization"
      title: "AI Target YX Optimization"
      summary: "Auto-selects the best algorithm for Y and picks improvement-target groups → supports What-if and Reverse What-if (auto-recommends optimal X combinations for a target Y; predicts Y change from X change)."
      stats:
        - { value: "60", unit: "", label: "Competing algorithms" }
        - { value: "Bottom 20%", unit: "", label: "Improvement-target group" }
        - { value: "Top 20%", unit: "", label: "Benchmark group" }
      blocks:
        - { head: "Best-Algorithm Selection", body: "Auto-selects the best algorithm for the Y variable from ~60 competing algorithms." }
        - { head: "Target Group Selection", body: "Derives increase/decrease plans for specific records (city, district, store, factory, person, machine) by overall average, bottom 20%, top 20%." }
        - { head: "What-if Analysis", body: "Predicts Y from X change; simulates Y when controllable X variables are adjusted." }
        - { head: "Reverse What-if Analysis", body: "Sets a target Y and reverse-solves the optimal X combination, with an AI summary (GPT report)." }
      result: "Risk and performance optimization across cities, facilities, sales, failures, and disasters"

