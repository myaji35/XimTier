en:
  privacy_page:
    eyebrow: Privacy Policy
    h1: Privacy Policy
    lead: "Last updated: 2026-08-01. XimTier complies with Korea PIPA and EU GDPR."
    sections:
      - title: "1. Information We Collect"
        body: |
          XimTier collects the following information to provide its services.
          - Demo requests: name, email, company, role, industry, data description, optional file, preferred time
          - Contact inquiries: name, email, company, industry, message
          - IR downloads: name, email, company, role
          - Auto-collected: web server access logs (IP, timestamp, request path) — for security and troubleshooting
          We use Google Analytics 4 to collect anonymized aggregate statistics such as visit counts, country, referral source, and device; IP addresses are anonymized.
      - title: "2. Purpose of Collection"
        body: |
          - Responding to demo requests and inquiries; scheduling
          - Sending IR deck download links
          - Legal compliance (e-commerce law, information & communications network act)
      - title: "3. Retention Period"
        body: |
          - Demo requests: 1 year after the meeting concludes (completed or cancelled)
          - Inquiries: 1 year after submission
          - IR deck requests: 1 year after submission. The download link itself expires 24 hours after issuance.
          - Case gallery comments: published comments are retained until deletion is requested
          - Web server access logs: deleted automatically after 14 days
          - Google Analytics data: deleted automatically after 14 months
          Records past these periods are purged automatically every day.
      - title: "4. Third-party Sharing"
        body: |
          XimTier does not share personal information with third parties, except:
          - Required by law or investigation
          - Service operation processing (Postmark/SendGrid for email — announced after domain confirmation)
          - Google LLC (Google Analytics 4 — web usage analytics, transferred internationally to the United States)
          - Google LLC (Google Sheets — inquiry and demo request management, transferred internationally to the United States)
            · Items: name, email, company, industry, inquiry/request content, submission time, referral source, language
            · Country: United States / Timing: immediately upon submission / Method: HTTPS API transfer
            · Recipient: Google LLC (contact: https://support.google.com/policies)
            · Purpose: inquiry response and lead management / Retention: 1 year after submission (same as Section 3)
            · Right to refuse: email contact@ximtier.com to stop the international transfer.
              Your inquiry will still be received and answered without any disadvantage
      - title: "5. User Rights"
        body: |
          You may exercise the following rights at any time.
          - Access, correct, or delete your personal information
          - Withdraw consent and stop processing
          - GDPR additional rights (EU residents): data portability, object to automated decisions
          Rights requests: contact@ximtier.com
      - title: "6. Cookie Policy"
        body: |
          XimTier uses cookies required to run the service and analytics cookies.
          - Session cookie: keeps you signed in. Removed when you close your browser.
          - Remember-me cookie: issued only if you tick "Remember me" at sign-in.
            Expires after 2 weeks, and is removed immediately when you sign out.
          - Like cookie: a random identifier that prevents duplicate likes in the case gallery.
            Expires after 30 days. It does not identify you or track you across other sites.
          - Analytics cookie (_ga): a visitor-distinguishing identifier issued by Google Analytics 4.
            It expires after 2 years and does not identify individuals.
          We do not use advertising cookies.
      - title: "7. Security Measures"
        body: |
          - In transit: TLS 1.2/1.3 (HTTPS enforced)
          - Passwords: stored as irreversible hashes (not readable by anyone, including admins)
          - Access control: Admin role separation, Rack::Attack rate limit
      - title: "8. Officer + Contact"
        body: |
          - Privacy Officer: Kang Seung-sik (CTO)
          - Contact: contact@ximtier.com
          - Dispute resolution: Korea PIPC (privacy.go.kr) / EU local DPA

  terms_page:
    eyebrow: Terms of Service
    h1: Terms of Service
    lead: "Last updated: 2026-05-13. These terms apply when using XimTier."
    sections:
      - title: "1. Service Overview"
        body: |
          XimTier is a Post-LLM Decision Intelligence platform.
          It helps non-experts make mathematically verifiable decisions within 5 minutes
          across data sovereignty, regulated industries, and Reverse What-If domains.
      - title: "2. Eligibility"
        body: |
          - 19+ years old or a legal entity
          - Consented to these terms and the privacy policy
          - Located in Korea or a GDPR-compliant jurisdiction
      - title: "3. Account + Data"
        body: |
          - Demo requests are available without creating an account.
          - Uploaded data files are accessed only by XimTier ops for demo preparation.
          - You may request data deletion at any time.
      - title: "4. Prohibited Actions"
        body: |
          - Identity theft
          - Disrupting service operation (DoS, abuse)
          - Uploading malicious code
          - Unauthorized access to XimTier systems
      - title: "5. Liability Limits"
        body: |
          - Demo results are clearly marked as "example data". Direct use for real decisions is at the user's risk.
          - Production deployments are fine-tuned on customer data under a separate SLA contract.
      - title: "6. Terms Changes"
        body: |
          - 7-day notice on site for any change
          - Major changes will be emailed to your registered address
      - title: "7. Dispute Resolution"
        body: |
          - Governed by the laws of the Republic of Korea
          - Jurisdiction: Seoul Central District Court
          - Non-Korean users: ICC arbitration available (preserving EU GDPR Art. 79 rights)
