# i18n-tasks finds and manages missing and unused translations.
# https://github.com/glebm/i18n-tasks
#
# 이 프로젝트는 번역을 config/locales/<locale>/<feature>.yml 하위 디렉토리로 분리한다.
# 기본 read 경로(config/locales/%{locale}.yml)만으로는 이 파일들을 읽지 못해
# i18n-tasks가 모든 키를 "누락"으로 오판한다. 앱(config/application.rb)의
# load_path 및 available_locales와 동일하게 맞춘다.

base_locale: ko
locales: [ko, en]

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/%{locale}/*.yml
    - config/locales/devise.%{locale}.yml

  # write 시 키를 feature별 파일로 라우팅 (수동 관리이므로 기본 라우팅만 둔다)
  write:
    - config/locales/%{locale}.yml

search:
  paths:
    - app/

ignore_unused:
  # Rails 신규 앱 기본 샘플 키 (실사용 없음)
  - hello
  # devise gem 이 자체 참조하는 키. 우리 코드가 t() 로 부르지 않으므로 미사용으로 잡힌다.
  - 'devise.*'
  - 'errors.messages.*'

  # ↓ 아래는 코드가 키 이름을 문자열로 조립해서 부른다 (t("...#{key}")).
  #   i18n-tasks 는 정적 분석이라 이런 동적 참조를 추적하지 못하고 전부 미사용으로 오판한다.
  #   실제로는 살아있는 페이지 콘텐츠이므로 지우면 화면이 죽는다.
  #   목록 추출: grep -rnoE 't\("[a-z0-9_.]+\.#\{' app/
  - 'v3detail.*'            # pages_controller: t("v3detail.#{@slug.tr('-','_')}")
  - 'cases.*'               # pages_controller: t("cases.#{slug}")
  - 'use_cases.cards.*'     # use_cases.html.erb: t("use_cases.cards.#{key}")
  - 'market_page.kpis.*'
  - 'pricing.tiers.*'
  - 'problem.cards.*'
  - 'team.members.*'
  - 'team.strengths.*'
  - 'vision.phases.*'
  - 'contact.industries.*'

  # Rails 표준 날짜/시각 포맷. t() 가 아니라 l() 헬퍼가 참조하므로 정적 분석에 안 잡힌다.
  - 'date.formats.*'
  - 'time.formats.*'

  # ── 아래는 실제로 쓰이지 않는 키다 (별도 이슈로 정리 예정) ──────────────────
  # 옛 랜딩/기획 버전에서 남은 잔재. 화면에 노출되지 않는다.
  #   예) site.hero.* 는 옛 히어로. 현재 홈은 v3.hero.* 를 쓴다.
  #       단 site.hero.cta_demo 는 아직 다른 페이지가 쓰므로 아래 목록에 없다.
  # 나중에 쓰려던 콘텐츠일 수 있어 임의 삭제하지 않고 예외로 둔다.
  # 그룹 와일드카드가 아니라 개별 키로 적는다 — 같은 그룹의 살아있는 키를 덮지 않기 위해서다.
  # 정리 시 이 블록을 지우고 health 를 다시 돌릴 것.
