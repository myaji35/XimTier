ignore_missing:
  # devise 번역은 devise gem 이 자체 제공/관리한다.
  # devise.en.yml 안의 키는 'devise.*' 가 아니라 'errors.messages.*' 로도 들어오므로
  # 두 경로 모두 지정해야 한다 — 'devise.*' 만으로는 걸러지지 않아 CI 가 실패했다.
  - 'devise.*'
  - 'errors.messages.*'
  # 샘플 키 (ignore_unused 와 짝)
  - hello
  # v3.versus_pptx — ko 에만 있고 en 이 없다. 다만 이 키를 참조하는 뷰가 없어
  # 화면에 노출되지 않는다(실사용 중인 것은 별도 키 v3.versus). 작성하다 만 콘텐츠로 보인다.
  # 영문을 채울지 키를 지울지는 콘텐츠 판단이므로 여기서 결정하지 않고 예외로 둔다.
  - 'v3.versus_pptx.*'
